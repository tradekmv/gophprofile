apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gophprofile.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secret.postgresPassword }}
  POSTGRES_PASSWORD: {{ .Values.secret.postgresPassword | quote }}
  {{- else }}
  POSTGRES_PASSWORD: ""
  {{- end }}
  {{- if .Values.secret.s3.accessKey }}
  S3_ACCESS_KEY: {{ .Values.secret.s3.accessKey | quote }}
  S3_SECRET_KEY: {{ .Values.secret.s3.secretKey | quote }}
  {{- end }}
  {{- if .Values.secret.kafka.username }}
  KAFKA_USERNAME: {{ .Values.secret.kafka.username | quote }}
  KAFKA_PASSWORD: {{ .Values.secret.kafka.password | quote }}
  {{- end }}
  {{- if .Values.secret.appSigningKey }}
  APP_SIGNING_KEY: {{ .Values.secret.appSigningKey | quote }}
  {{- end }}
{{- /*
  В production ОБЯЗАТЕЛЬНО установите:
    --set secret.postgresPassword=...
    --set secret.s3.accessKey=... --set secret.s3.secretKey=...
    --set secret.appSigningKey=...

  Альтернатива: используйте external-secrets-operator или HashiCorp Vault
  для автоматической синхронизации секретов.
*/}}
