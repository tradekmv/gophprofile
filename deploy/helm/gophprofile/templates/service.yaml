apiVersion: v1
kind: Service
metadata:
  name: {{ include "gophprofile.fullname" . }}-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gophprofile.serverLabels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: {{ .Values.service.name }}
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: {{ .Values.service.protocol }}
  selector:
    {{- include "gophprofile.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gophprofile.fullname" . }}-server-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gophprofile.serverLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9095
      targetPort: 9095
      protocol: TCP
  selector:
    {{- include "gophprofile.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
{{- if .Values.worker.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gophprofile.fullname" . }}-worker-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gophprofile.workerLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9096
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "gophprofile.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker
{{- end }}
