# values для локальной разработки (Rancher Desktop, minikube, kind).
# Использование:
#   helm install gophprofile ./deploy/helm/gophprofile -f values-dev.yaml

replicaCount: 1

image:
  repository: gophprofile-server
  tag: latest
  pullPolicy: Never  # Используем локально собранный образ

# Ingress: открываем для доступа с localhost.
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: gophprofile.local
      paths:
        - path: /
          pathType: Prefix

# HPA отключаем в dev (не нужен).
autoscaling:
  enabled: false

# Меньше ресурсов в dev.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

# Service в NodePort для тестирования с хоста.
service:
  type: NodePort
  port: 8080
  targetPort: 8080

# Конфигурация для dev-окружения.
config:
  postgres:
    host: postgres
    port: 5432
    database: gophprofile
    user: gophprofile
    sslmode: disable
  s3:
    endpoint: minio:9000
    region: us-east-1
    bucket: avatars
    useSSL: false
  kafka:
    brokers: "kafka:9092"
    topic: "avatars.events"
  thumbnailSizes: "100x100,300x300"
  maxUploadSize: 10485760
  dbPoolMaxConns: 5

# В dev задаём тестовые секреты (НЕ для production).
secret:
  postgresPassword: "gophprofile"
  s3:
    accessKey: "minioadmin"
    secretKey: "minioadmin"
  appSigningKey: "dev-signing-key-change-in-prod"

# NetworkPolicy отключаем для простоты в dev.
networkPolicy:
  enabled: false

# Migration job: создаём с задержкой (для dev БД).
migration:
  enabled: true
  backoffLimit: 5
