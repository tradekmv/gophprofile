global:
  resolve_timeout: 5m

route:
  receiver: 'dev-null'
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h

receivers:
  # В dev — no-op receiver. В проде замените на email/slack/pagerduty.
  - name: 'dev-null'

inhibit_rules:
  - source_matchers: [severity = "critical"]
    target_matchers: [severity = "warning"]
    equal: ['alertname']

templates: []
