<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GophProfile — Загрузка аватарок</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900">
  <div class="container mx-auto px-4 py-8 max-w-4xl">
    <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl border border-white/20 overflow-hidden">
      <header class="bg-gradient-to-r from-purple-600 to-blue-600 p-6">
        <h1 class="text-3xl font-bold text-white text-center">GophProfile</h1>
        <p class="text-white/80 text-center mt-2">Загрузите аватарку и управляйте галереей</p>
      </header>

      <main class="p-6 space-y-6">
        <!-- Поле user ID + кнопка обновить -->
        <div class="flex items-end gap-3">
          <div class="flex-1">
            <label for="userId" class="block text-sm font-medium text-white mb-2">
              User ID <span class="text-red-400">*</span>
            </label>
            <input type="text" id="userId" required placeholder="например: alice"
              class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all">
          </div>
          <button type="button" id="loadGalleryBtn"
            class="px-4 py-3 bg-purple-600 hover:bg-purple-700 text-white rounded-lg transition-all">
            Загрузить галерею
          </button>
        </div>

        <!-- Форма загрузки -->
        <form id="uploadForm" class="space-y-4 border-t border-white/20 pt-6">
          <h2 class="text-xl font-semibold text-white">Загрузить новую аватарку</h2>

          <div>
            <label for="image" class="block text-sm font-medium text-white mb-2">
              Файл (JPEG / PNG / WebP, до 10 МБ) <span class="text-red-400">*</span>
            </label>
            <input type="file" id="image" accept="image/*" required
              class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-lg text-white file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-purple-600 file:text-white hover:file:bg-purple-700 cursor-pointer focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all">
            <div id="imagePreview" class="mt-4 hidden">
              <img id="previewImg" src="" alt="Превью" class="w-32 h-32 object-cover rounded-lg shadow-lg mx-auto">
            </div>
          </div>

          <button type="submit" id="submitBtn"
            class="w-full bg-gradient-to-r from-purple-600 to-blue-600 text-white font-semibold py-3 px-6 rounded-lg shadow-lg hover:from-purple-700 hover:to-blue-700 focus:outline-none focus:ring-2 focus:ring-purple-500 transition-all">
            <span id="btnText">Загрузить</span>
            <span id="btnLoader" class="hidden">Загрузка...</span>
          </button>
        </form>

        <!-- Статус загрузки -->
        <div id="uploadStatus" class="hidden"></div>

        <!-- Ошибка -->
        <div id="errorMessage" class="hidden bg-red-500/20 border border-red-500/50 text-red-200 px-4 py-3 rounded-lg"></div>

        <!-- Галерея -->
        <div class="border-t border-white/20 pt-6">
          <h2 class="text-xl font-semibold text-white mb-4">Галерея</h2>
          <div id="galleryStatus" class="text-white/70 text-sm mb-3"></div>
          <div id="gallery" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>
        </div>
      </main>
    </div>
  </div>

  <script>
    // Базовый URL берём из location.origin, чтобы SPA работала и за reverse-proxy.
    const API = location.origin;
    let currentUserId = '';

    // Элементы DOM.
    const userIdInput = document.getElementById('userId');
    const imageInput = document.getElementById('image');
    const imagePreview = document.getElementById('imagePreview');
    const previewImg = document.getElementById('previewImg');
    const uploadForm = document.getElementById('uploadForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnLoader = document.getElementById('btnLoader');
    const uploadStatus = document.getElementById('uploadStatus');
    const errorMessage = document.getElementById('errorMessage');
    const gallery = document.getElementById('gallery');
    const galleryStatus = document.getElementById('galleryStatus');
    const loadGalleryBtn = document.getElementById('loadGalleryBtn');

    // Превью выбранного файла.
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file && file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          previewImg.src = ev.target.result;
          imagePreview.classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      } else {
        imagePreview.classList.add('hidden');
      }
    });

    // Загрузка аватарки.
    uploadForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const userId = userIdInput.value.trim();
      const file = imageInput.files[0];
      if (!userId) return showError('Укажите User ID');
      if (!file) return showError('Выберите файл');

      currentUserId = userId;
      setLoading(true);
      hideError();

      const formData = new FormData();
      formData.append('file', file);

      try {
        const resp = await fetch(`${API}/api/v1/avatars`, {
          method: 'POST',
          headers: { 'X-User-ID': userId },
          body: formData,
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) {
          showError(`Ошибка ${resp.status}: ${data.details || data.error || resp.statusText}`);
        } else {
          const sizeKb = Math.round((data.id ? 1 : 0));
          showStatus(`Загружено (id=${data.id.slice(0, 8)}...), обработка через несколько секунд...`, 'success');
          // Сбрасываем форму и превью.
          uploadForm.reset();
          imagePreview.classList.add('hidden');
          // Обновляем галерею через 3 секунды (даём воркеру время обработать).
          setTimeout(loadGallery, 3000);
        }
      } catch (err) {
        showError(`Сеть: ${err.message}`);
      } finally {
        setLoading(false);
      }
    });

    // Загрузка галереи.
    async function loadGallery() {
      const userId = userIdInput.value.trim();
      if (!userId) {
        showError('Укажите User ID');
        return;
      }
      currentUserId = userId;
      galleryStatus.textContent = 'Загружаю...';
      gallery.innerHTML = '';
      try {
        const resp = await fetch(`${API}/api/v1/users/${encodeURIComponent(userId)}/avatars`);
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) {
          showError(`Не удалось загрузить галерею: ${resp.status}`);
          galleryStatus.textContent = '';
          return;
        }
        const items = data.items || [];
        if (items.length === 0) {
          galleryStatus.textContent = 'Пока ничего нет. Загрузите первую аватарку.';
          return;
        }
        galleryStatus.textContent = `Найдено: ${items.length}`;
        for (const item of items) {
          gallery.appendChild(renderCard(item));
        }
      } catch (err) {
        showError(`Сеть: ${err.message}`);
        galleryStatus.textContent = '';
      }
    }

    // Карточка одной аватарки.
    function renderCard(item) {
      const card = document.createElement('div');
      card.className = 'bg-white/5 border border-white/10 rounded-lg p-3 flex flex-col';
      card.id = `card-${item.id}`;

      const imgLink = document.createElement('a');
      imgLink.href = item.url;
      imgLink.target = '_blank';
      imgLink.rel = 'noopener';
      const img = document.createElement('img');
      img.src = `${item.url}?size=100x100`;
      img.alt = 'avatar';
      img.loading = 'lazy';
      img.className = 'w-full aspect-square object-cover rounded mb-2 bg-black/30';
      imgLink.appendChild(img);
      card.appendChild(imgLink);

      const meta = document.createElement('div');
      meta.className = 'text-xs text-white/60 mb-2 break-all';
      const fmtBytes = (n) => {
        if (n < 1024) return `${n} B`;
        if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
        return `${(n / 1024 / 1024).toFixed(1)} MB`;
      };
      meta.textContent = `${item.file_name} · ${item.mime_type} · ${fmtBytes(item.size_bytes)}`;
      card.appendChild(meta);

      const actions = document.createElement('div');
      actions.className = 'flex gap-2 mt-auto';

      const dlBtn = document.createElement('a');
      dlBtn.href = item.url;
      dlBtn.target = '_blank';
      dlBtn.textContent = 'Открыть';
      dlBtn.className = 'flex-1 text-center px-2 py-1 bg-blue-600 hover:bg-blue-700 text-white text-sm rounded transition-all';
      actions.appendChild(dlBtn);

      const delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.textContent = 'Удалить';
      delBtn.className = 'flex-1 px-2 py-1 bg-red-600 hover:bg-red-700 text-white text-sm rounded transition-all';
      delBtn.addEventListener('click', async () => {
        if (!confirm(`Удалить аватарку ${item.id.slice(0, 8)}...?`)) return;
        delBtn.disabled = true;
        try {
          const r = await fetch(`${API}/api/v1/avatars/${item.id}`, {
            method: 'DELETE',
            headers: { 'X-User-ID': currentUserId },
          });
          if (r.ok || r.status === 204) {
            card.remove();
            const count = gallery.children.length;
            galleryStatus.textContent = count > 0 ? `Найдено: ${count}` : 'Пока ничего нет.';
          } else {
            showError(`Удалить не удалось: ${r.status}`);
            delBtn.disabled = false;
          }
        } catch (err) {
          showError(`Сеть: ${err.message}`);
          delBtn.disabled = false;
        }
      });
      actions.appendChild(delBtn);

      card.appendChild(actions);
      return card;
    }

    function setLoading(loading) {
      submitBtn.disabled = loading;
      btnText.classList.toggle('hidden', loading);
      btnLoader.classList.toggle('hidden', !loading);
    }

    function showStatus(message, kind) {
      uploadStatus.className = `px-4 py-3 rounded-lg ${kind === 'success'
        ? 'bg-green-500/20 border border-green-500/50 text-green-200'
        : 'bg-blue-500/20 border border-blue-500/50 text-blue-200'}`;
      uploadStatus.textContent = message;
      uploadStatus.classList.remove('hidden');
      setTimeout(() => uploadStatus.classList.add('hidden'), 5000);
    }

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.remove('hidden');
    }

    function hideError() {
      errorMessage.classList.add('hidden');
    }

    // Кнопка "Загрузить галерею".
    loadGalleryBtn.addEventListener('click', loadGallery);
  </script>
</body>

</html>
